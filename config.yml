disabled-worlds:
  - 'example_world'

prefix: '&x&2&D&F&F&0&0&lCHATGAMES'

allow_starting_from_disabled: true

min_players_online: 1

time_minutes: 25

timeToGuess_seconds: 20

use-permission-toplay: false

playSound: true
sound: 'ENTITY_PLAYER_LEVELUP'


unscramble:
    enable: true
    
    case-sensitive: true
    titleMessage: '&b%word%'
    subtitleMessage: '&aOrdena la palabra'

unreverse:
    enable: true
    
    case-sensitive: true
    titleMessage: '&b%word%'
    subtitleMessage: '&aEscribe al derecho'

reaction:
    enable: true
    
    case-sensitive: true
    titleMessage: '&b%word%'
    subtitleMessage: '&aEscribe'
    
fillout:
    enable: true
    
    case-sensitive: true
    titleMessage: '&b%word%'
    subtitleMessage: '&aCompleta'

random:
    enable: true
    
    case-sensitive: true
    length: 6
    character_type: ALPHANUMERIC
    
    titleMessage: '&b%random%'
    subtitleMessage: '&aEscribe'

math:
    enable: true
    
    case-sensitive: false
    difficulty: 2
    operators:
      - '+'
      - '-'
      - '*'
      - '/'
      
    titleMessage: '&b%equation%'
    subtitleMessage: '&aResuelve'
    
variable:
    enable: true
    
    case-sensitive: false
    
    titleMessage: '&bRESUELVE'
    subtitleMessage: '&aPara &7`&b%symbol%&7`'
    
    result-min: 20
    result-max: 100
    
    toGet: '✗'
    data:
      - '✯;10'
      - '♛;15'
      - '❅;20'
      - '♫;25'
          
